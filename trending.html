<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Trending Matches & Social Pulse | LivescoreFree.online</title>
    <meta name="description" content="Discover what's trending in sports. Real-time engagement spikes, viral match updates, and global sports buzz.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300;400;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0E0E0E; }
        ::-webkit-scrollbar-thumb { background: #CC1616; }
        .pulse-red { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(204, 22, 22, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(204, 22, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(204, 22, 22, 0); }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#CC1616",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-container-low": "#1c1b1b",
                        "surface-container": "#201f1f",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-highest": "#353534"
                    },
                    fontFamily: { "body": ["Lexend"] }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body overflow-x-hidden">
    <!-- Header -->
    <nav id="main-header" class="fixed top-0 w-full z-[100] border-b border-white/10 bg-[#0E0E0E]/90 backdrop-blur-xl transition-transform duration-300">
        <div class="flex justify-between items-center px-6 h-16 w-full max-w-[1920px] mx-auto">
            <div class="flex items-center gap-4">
                <button id="sidebar-toggle" class="material-symbols-outlined text-primary hover:bg-white/5 p-2 rounded-full">menu</button>
                <a href="index.html" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <span class="material-symbols-outlined text-primary pulse-red rounded-full">broadcast_on_personal</span>
                    <div class="text-2xl font-black italic tracking-tighter text-primary">Livescorefree</div>
                </a>
            </div>
            <div class="hidden lg:flex gap-8 items-center font-bold uppercase tracking-tighter">
                <a class="text-on-surface/60 hover:text-primary transition-all" href="index.html">Home</a>
                <a class="text-on-surface/60 hover:text-primary transition-all" href="live.html">Live</a>
                <a class="text-on-surface/60 hover:text-primary transition-all active-link" href="trending.html">Trending</a>
                <a class="text-on-surface/60 hover:text-primary transition-all" href="upcoming.html">Upcoming</a>
                <a class="text-on-surface/60 hover:text-primary transition-all" href="results.html">Results</a>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="openSearchModal()" class="material-symbols-outlined hover:text-primary">search</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar & Main Content -->
    <div class="flex pt-16 min-h-screen">
        <aside id="sidebar" class="fixed left-0 top-16 z-[90] h-[calc(100vh-64px)] w-64 -translate-x-full transition-transform duration-300 bg-[#0E0E0E] border-r border-white/5 overflow-y-auto">
            <div class="p-6">
                <!-- Sidebar content injected by script.js -->
                <div id="sidebar-live-container" class="space-y-4"></div>
            </div>
        </aside>

        <main class="flex-1 w-full bg-surface relative min-h-screen pb-20">
            <!-- Dynamic Hero -->
            <section id="hero-slider-container" class="relative w-full h-[500px] bg-surface-container-lowest overflow-hidden flex flex-col justify-end p-8 lg:p-16">
                <div class="animate-pulse">
                    <h1 class="text-5xl lg:text-7xl font-black italic uppercase tracking-tighter mb-4 opacity-20">Scanning Global Pulse...</h1>
                </div>
            </section>

            <!-- Sports Filter -->
            <section class="sticky top-16 z-40 bg-surface/90 backdrop-blur-xl border-b border-white/5 px-8 py-4 overflow-x-auto">
                <div id="sports-tabs" class="flex items-center gap-4 min-w-max"></div>
            </section>

            <!-- Main Dynamic Grid -->
            <div class="p-8 grid grid-cols-1 xl:grid-cols-4 gap-8 max-w-[1600px] mx-auto">
                <div class="xl:col-span-3 space-y-12">
                    <div>
                        <h2 class="text-4xl font-black italic tracking-tighter uppercase mb-2">Social Spikes & Live Heat</h2>
                        <p class="text-on-surface/40 text-[10px] font-bold uppercase tracking-[0.3em]">Real-time engagement detected via ESPN API</p>
                    </div>

                    <!-- Matches -->
                    <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="col-span-full py-20 text-center opacity-20 uppercase font-black tracking-[0.4em]">Optimizing Multi-Sport Aggregator...</div>
                    </div>

                    <!-- Trending News Grid -->
                    <div class="space-y-6">
                        <h3 class="text-2xl font-black italic uppercase tracking-tighter">Viral Sports Moments</h3>
                        <div id="news-grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
                    </div>
                </div>

                <!-- Sidebar News/Players -->
                <aside class="space-y-12">
                    <section class="glass-panel p-6 rounded-xl bg-white/5">
                        <h3 class="font-black italic uppercase tracking-tighter text-lg mb-6 text-primary">Live Pulse</h3>
                        <div id="latest-headlines-container" class="space-y-6"></div>
                    </section>
                    
                    <section>
                        <h3 class="font-black italic uppercase tracking-tighter text-lg mb-6">Trending Athletes</h3>
                        <div id="players-container" class="space-y-4"></div>
                    </section>
                </aside>
            </div>
        </main>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-[200] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeSearchModal()"></div>
        <div class="relative max-w-2xl mx-auto mt-24 px-6 bg-surface-container border border-white/10 rounded-2xl p-6">
            <input id="search-input" type="text" placeholder="Search matches, teams, leagues..." class="w-full bg-transparent text-xl font-black outline-none">
            <div id="search-results" class="mt-4 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="notification-toast" class="fixed bottom-8 right-8 z-[300] hidden"></div>

    <script src="js/script.js"></script>
    <script>
        // Inline script to ensure sidebar toggle works even if script.js is still loading
        document.getElementById('sidebar-toggle').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        });
    </script>
</body>
</html>
